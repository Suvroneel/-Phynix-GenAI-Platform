{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Project Phynix{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/icons/favicon.ico' %}">
    
    <!-- Google Fonts - Exact same as Streamlit -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Poppins:wght@400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Base Styles - Matching Streamlit exactly -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header styling - Exact from Streamlit */
        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 48px;
            font-weight: 600;
            color: #000;
            margin-bottom: -15px;
        }

        .tagline {
            font-family: 'Poppins', sans-serif;
            font-size: 28px;
            font-weight: 400;
            color: #B22222;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #777;
            text-align: center;
            margin-top: -10px;
        }

        /* Phynix Logo -->
        .logo-image {
            width: 100px;
            height: auto;
        }

        /* Buttons - Exact gradient from Streamlit */
        .btn {
            background: linear-gradient(90deg, #ff914d, #ff6e40);
            color: white !important;
            padding: 13px 15px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 14px rgba(255, 110, 64, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: linear-gradient(90deg, #ff6e40, #ff914d);
            box-shadow: 0 6px 18px rgba(255, 110, 64, 0.45);
            transform: translateY(-2px);
        }

        /* Messages/Alerts */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* Spacing utilities */
        .mt-10 { margin-top: 10px; }
        .mt-20 { margin-top: 20px; }
        .mt-30 { margin-top: 30px; }
        .mt-50 { margin-top: 50px; }
        .mt-100 { margin-top: 100px; }
        .mb-10 { margin-bottom: 10px; }
        .mb-20 { margin-bottom: 20px; }

        /* Footer - Exact from Streamlit */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1A2526;
            color: #F5F6F5;
            text-align: center;
            padding: 12px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            z-index: 10000;
            box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.06);
        }

        .footer a {
            color: #B22222;
            text-decoration: none;
            transition: color 0.3s ease;
            margin: 0 8px;
        }

        .footer a:hover {
            color: #D97C7C;
            text-decoration: underline;
        }

        .footer .separator {
            color: #627677;
            margin: 0 5px;
        }

        .footer p {
            margin: 6px 0 0;
            color: #A8B5B7;
            font-size: 12.5px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-title {
                font-size: 36px;
            }
            .tagline {
                font-size: 20px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <!-- Footer - Exact from Streamlit footer.py -->
    <div class="footer">
        <div class="made-by-section">
            <span>Made by</span>
            <a href="https://www.linkedin.com/in/suvroneel-nathak-593602197/" target="_blank" class="name">Suvroneel Nathak</a>
            <span class="separator">|</span>
            <a href="https://github.com/Suvroneel" target="_blank">GitHub</a>
            <span class="separator">|</span>
            <a href="https://github.com/Suvroneel" target="_blank">Contact</a>
        </div>
        <p>© 2025 <span class="project">Project Phynix</span></p>
        <p class="tagline">AI-Powered Mental Health Platform</p>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
